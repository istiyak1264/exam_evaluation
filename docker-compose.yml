name: exam-evaluation

services:
  db:
    image: mysql:8.4
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: exam_eval
      MYSQL_USER: exam
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
    ports:
      - "127.0.0.1:${DB_PORT:-53306}:3306"
    volumes:
      - mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uexam -p\"$$MYSQL_PASSWORD\""]
      interval: 5s
      timeout: 4s
      retries: 30
    restart: unless-stopped

  backend:
    build: ./backend
    image: exam-evaluation-backend:local
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-development}
      ADDR: ":8080"
      DATABASE_URL: exam:${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}@tcp(db:3306)/exam_eval?parseTime=true&multiStatements=true
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      ACCESS_TTL_MINUTES: "15"
      REFRESH_TTL_HOURS: "168"
      STORAGE_DRIVER: local
      STORAGE_DIR: /data/scripts
      MAX_UPLOAD_MB: "25"
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8090}
      COOKIE_SECURE: "false"
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:?set BOOTSTRAP_ADMIN_EMAIL in .env}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?set BOOTSTRAP_ADMIN_PASSWORD in .env}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-Administrator}
    volumes:
      - scripts:/data/scripts
    restart: unless-stopped

  web:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8090}:8080"
    restart: unless-stopped

volumes:
  mysqldata:
  scripts:
